openapi: 3.0.3
info: {title: API, version: "1.0.0"}
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
  /readyz:
    get:
      operationId: readyz
      responses:
        "200": {description: ready, content: {application/json: {schema: {type: object, properties: {status: {type: string}, db: {type: string}}}}}}
        "503": {description: db down}
  /v1/auth/device:
    post:
      operationId: authDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [install_id, device_hash_raw, market, app_version, os_version, model]
              properties:
                install_id: {type: string, format: uuid}
                device_hash_raw: {type: string, minLength: 1, maxLength: 128}
                market: {type: string, enum: [bazaar, myket]}
                app_version: {type: string}
                os_version: {type: string}
                model: {type: string}
      responses:
        "200": {description: session, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/auth/refresh:
    post:
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        "200": {description: session, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /v1/me:
    get:
      operationId: getMe
      security: [{bearer: []}]
      responses:
        "200":
          description: profile
          content:
            application/json:
              schema:
                type: object
                required: [user_id, created_at, phone_linked]
                properties:
                  user_id: {type: string, format: uuid}
                  created_at: {type: string, format: date-time}
                  phone_linked: {type: boolean}
        "401": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteMe
      security: [{bearer: []}]
      responses:
        "204": {description: deleted}
        "401": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Error:
      description: error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Session:
      type: object
      required: [user_id, access_token, access_expires_at, refresh_token]
      properties:
        user_id: {type: string, format: uuid}
        access_token: {type: string}
        access_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, enum: [INVALID_INPUT, UNAUTHENTICATED, TOKEN_INVALID, TOKEN_REUSED, FORBIDDEN, NOT_FOUND, TRIAL_ALREADY_USED, TRIAL_DISABLED, PURCHASE_ALREADY_CLAIMED, PURCHASE_INVALID, PAYLOAD_TOO_LARGE, BACKUP_TOO_LARGE, RATE_LIMITED, UPGRADE_REQUIRED, MARKET_UNAVAILABLE, INTERNAL]}
            message: {type: string}
            request_id: {type: string}
    EntitlementState:
      type: object
      required: [entitlements, trial, server_time, valid_until, grace_days, signature, kid]
      properties:
        entitlements:
          type: array
          items: {type: object, required: [key, source, starts_at, ends_at], properties: {key: {type: string, enum: [premium]}, source: {type: string, enum: [trial, subscription, pass, promo]}, starts_at: {type: string, format: date-time}, ends_at: {type: string, format: date-time}}}
        trial: {type: object, required: [eligible, used], properties: {eligible: {type: boolean}, used: {type: boolean}, ends_at: {type: string, format: date-time, nullable: true}}}
        server_time: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        grace_days: {type: integer}
        signature: {type: string}
        kid: {type: string}
    ConfigResponse:
      type: object
      required: [version, payload, experiments, etag]
      properties:
        version: {type: integer}
        payload: {type: object, additionalProperties: true}
        experiments: {type: object, additionalProperties: {type: string}}
        etag: {type: string}
    Event:
      type: object
      required: [event_id, name, ts, session_id, props]
      properties:
        event_id: {type: string, format: uuid}
        name: {type: string}
        ts: {type: string, format: date-time}
        session_id: {type: string}
        props: {type: object, additionalProperties: true}
