openapi: 3.0.3
info: {title: API, version: "1.0.0"}
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
  /readyz:
    get:
      operationId: readyz
      responses:
        "200": {description: ready, content: {application/json: {schema: {type: object, properties: {status: {type: string}, db: {type: string}}}}}}
        "503": {description: db down}
  /v1/auth/device:
    post:
      operationId: authDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [install_id, device_hash_raw, market, app_version, os_version, model]
              properties:
                install_id: {type: string, format: uuid}
                device_hash_raw: {type: string, minLength: 1, maxLength: 128}
                market: {type: string, enum: [bazaar, myket]}
                app_version: {type: string}
                os_version: {type: string}
                model: {type: string}
      responses:
        "200": {description: session, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/auth/refresh:
    post:
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        "200": {description: session, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /v1/me:
    get:
      operationId: getMe
      security: [{bearer: []}]
      responses:
        "200":
          description: profile
          content:
            application/json:
              schema:
                type: object
                required: [user_id, created_at, phone_linked]
                properties:
                  user_id: {type: string, format: uuid}
                  created_at: {type: string, format: date-time}
                  phone_linked: {type: boolean}
        "401": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteMe
      security: [{bearer: []}]
      responses:
        "204": {description: deleted}
        "401": {$ref: "#/components/responses/Error"}
  /v1/entitlements:
    get:
      operationId: getEntitlements
      security: [{bearer: []}]
      responses:
        "200": {description: state, content: {application/json: {schema: {$ref: "#/components/schemas/EntitlementState"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/trial/start:
    post:
      operationId: startTrial
      security: [{bearer: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provisional_started_at: {type: string, format: date-time, nullable: true}
      responses:
        "200": {description: state, content: {application/json: {schema: {$ref: "#/components/schemas/EntitlementState"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/purchases/verify:
    post:
      operationId: verifyPurchase
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [market, product_id, market_sku, purchase_token]
              properties:
                market: {type: string, enum: [bazaar, myket]}
                product_id: {type: string}
                market_sku: {type: string}
                purchase_token: {type: string}
                order_id: {type: string}
      responses:
        "200":
          description: verified
          content:
            application/json:
              schema:
                type: object
                required: [purchase_id, purchase_state, entitlement_state, coins_granted]
                properties:
                  purchase_id: {type: string, format: uuid}
                  purchase_state: {type: string, enum: [pending, verified, invalid, refunded, expired, canceled]}
                  entitlement_state: {$ref: "#/components/schemas/EntitlementState"}
                  coins_granted: {type: integer}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/purchases/restore:
    post:
      operationId: restorePurchases
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [market, purchases]
              properties:
                market: {type: string, enum: [bazaar, myket]}
                purchases:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [product_id, market_sku, purchase_token]
                    properties:
                      product_id: {type: string}
                      market_sku: {type: string}
                      purchase_token: {type: string}
                      order_id: {type: string}
      responses:
        "200": {description: state, content: {application/json: {schema: {$ref: "#/components/schemas/EntitlementState"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/config:
    get:
      operationId: getConfig
      security: [{}, {bearer: []}]
      parameters:
        - {name: known_version, in: query, required: false, schema: {type: integer}}
        - {name: If-None-Match, in: header, required: false, schema: {type: string}}
      responses:
        "200":
          description: config (ETag header set; gzip when accepted)
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/ConfigResponse"}}}
        "304": {description: not modified}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/content/manifest:
    get:
      operationId: getContentManifest
      security: []
      responses:
        "200":
          description: packs compatible with X-App-Version
          content:
            application/json:
              schema:
                type: object
                required: [packs]
                properties:
                  packs:
                    type: array
                    items:
                      type: object
                      required: [pack_key, version, sha256, size, min_app_version, url]
                      properties:
                        pack_key: {type: string}
                        version: {type: integer}
                        sha256: {type: string}
                        size: {type: integer}
                        min_app_version: {type: string}
                        url: {type: string}
        "304": {description: not modified}
  /v1/content/packs/{pack_key}/{version}:
    get:
      operationId: getContentPack
      security: []
      parameters:
        - {name: pack_key, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: immutable pack (Cache-Control public, max-age=31536000, immutable)
          content: {application/json: {schema: {type: object}}}
        "304": {description: not modified}
        "404": {$ref: "#/components/responses/Error"}
  /v1/events:
    post:
      operationId: ingestEvents
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                sent_at: {type: string, format: date-time}
                events:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: {$ref: "#/components/schemas/Event"}
      responses:
        "200":
          description: result
          content:
            application/json:
              schema:
                type: object
                required: [accepted, rejected, rejected_reasons]
                properties:
                  accepted: {type: integer}
                  rejected: {type: integer}
                  rejected_reasons: {type: object, additionalProperties: {type: integer}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
  /admin/v1/config:
    post:
      operationId: adminPublishConfig
      security: [{basic: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [payload], properties: {payload: {type: object}, min_app_version: {type: string}, activate: {type: boolean}}}}}
      responses:
        "201": {description: published, content: {application/json: {schema: {type: object, required: [version, active], properties: {version: {type: integer}, active: {type: boolean}}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/v1/config/{version}/activate:
    post:
      operationId: adminActivateConfig
      security: [{basic: []}]
      parameters: [{name: version, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": {description: activated, content: {application/json: {schema: {type: object, required: [version, active], properties: {version: {type: integer}, active: {type: boolean}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/v1/experiments/{key}:
    put:
      operationId: adminPutExperiment
      security: [{basic: []}]
      parameters: [{name: key, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        "204": {description: stored}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/v1/content/packs:
    post:
      operationId: adminPublishPack
      security: [{basic: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        "201": {description: published, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/v1/users/{id}/grants:
    post:
      operationId: adminGrantPromo
      security: [{basic: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [days, reason], properties: {days: {type: integer}, reason: {type: string}}}}}
      responses:
        "201": {description: granted, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/v1/users/{id}:
    get:
      operationId: adminGetUser
      security: [{basic: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: account facts only, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/v1/metrics/daily:
    get:
      operationId: adminDailyMetrics
      security: [{basic: []}]
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: metric, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: rollups, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /v1/auth/phone/otp:
    post:
      operationId: phoneOtp
      security: [{bearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [phone], properties: {phone: {type: string}}}}}
      responses:
        "200":
          description: code sent
          content: {application/json: {schema: {type: object, required: [challenge_id, retry_after_s], properties: {challenge_id: {type: string, format: uuid}, retry_after_s: {type: integer}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/auth/phone/verify:
    post:
      operationId: phoneVerify
      security: [{bearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [challenge_id, code], properties: {challenge_id: {type: string}, code: {type: string}}}}}
      responses:
        "200":
          description: linked; merged=true when the phone belonged to another account and the device moved to it
          content:
            application/json:
              schema:
                type: object
                required: [user_id, access_token, access_expires_at, refresh_token, merged]
                properties:
                  user_id: {type: string, format: uuid}
                  access_token: {type: string}
                  access_expires_at: {type: string, format: date-time}
                  refresh_token: {type: string}
                  merged: {type: boolean}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /v1/backup:
    put:
      operationId: putBackup
      security: [{bearer: []}]
      parameters:
        - {name: X-Backup-Schema, in: header, required: true, schema: {type: integer}}
        - {name: X-Backup-Sha256, in: header, required: true, schema: {type: string}}
        - {name: X-Kdf-Params, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary, maxLength: 10485760}}}
      responses:
        "200": {description: stored, content: {application/json: {schema: {type: object, required: [updated_at], properties: {updated_at: {type: string, format: date-time}}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    get:
      operationId: getBackup
      security: [{bearer: []}]
      responses:
        "200":
          description: the opaque encrypted blob; metadata in X-Backup-Schema, X-Backup-Sha256, X-Kdf-Params, X-Backup-Updated-At
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteBackup
      security: [{bearer: []}]
      responses:
        "204": {description: deleted}
        "401": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
    basic: {type: http, scheme: basic}
  responses:
    Error:
      description: error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Session:
      type: object
      required: [user_id, access_token, access_expires_at, refresh_token]
      properties:
        user_id: {type: string, format: uuid}
        access_token: {type: string}
        access_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, enum: [INVALID_INPUT, UNAUTHENTICATED, TOKEN_INVALID, TOKEN_REUSED, FORBIDDEN, NOT_FOUND, TRIAL_ALREADY_USED, TRIAL_DISABLED, PURCHASE_ALREADY_CLAIMED, PURCHASE_INVALID, PAYLOAD_TOO_LARGE, BACKUP_TOO_LARGE, RATE_LIMITED, UPGRADE_REQUIRED, MARKET_UNAVAILABLE, INTERNAL, PHONE_INVALID, OTP_INVALID, OTP_EXPIRED, SMS_UNAVAILABLE]}
            message: {type: string}
            request_id: {type: string}
    EntitlementState:
      type: object
      required: [entitlements, trial, server_time, valid_until, grace_days, signature, kid]
      properties:
        entitlements:
          type: array
          items: {type: object, required: [key, source, starts_at, ends_at], properties: {key: {type: string, enum: [premium]}, source: {type: string, enum: [trial, subscription, pass, promo]}, starts_at: {type: string, format: date-time}, ends_at: {type: string, format: date-time}}}
        trial: {type: object, required: [eligible, used, ends_at], properties: {eligible: {type: boolean}, used: {type: boolean}, ends_at: {type: string, format: date-time, nullable: true}}}
        server_time: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        grace_days: {type: integer}
        signature: {type: string}
        kid: {type: string}
    ConfigResponse:
      type: object
      required: [version, payload, experiments, etag]
      properties:
        version: {type: integer}
        payload: {type: object, additionalProperties: true}
        experiments: {type: object, additionalProperties: {type: string}}
        etag: {type: string}
    Event:
      type: object
      required: [event_id, name, ts, session_id, props]
      properties:
        event_id: {type: string, format: uuid}
        name: {type: string}
        ts: {type: string, format: date-time}
        session_id: {type: string}
        props: {type: object, additionalProperties: true}
