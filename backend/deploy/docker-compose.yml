services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 10
  migrate:
    build: {context: .., dockerfile: deploy/Dockerfile}
    entrypoint: ["/app/migrate", "up"]
    env_file: .env
    environment: {DATABASE_URL: "postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app?sslmode=disable"}
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app?sslmode=disable"
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
    volumes: ["./keys:/keys:ro"]
    depends_on: {migrate: {condition: service_completed_successfully}}
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile}
    entrypoint: ["/app/worker"]
    restart: unless-stopped
    env_file: .env
    environment: {DATABASE_URL: "postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app?sslmode=disable"}
    depends_on: {migrate: {condition: service_completed_successfully}}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [api]
volumes:
  pgdata:
  caddy_data:
