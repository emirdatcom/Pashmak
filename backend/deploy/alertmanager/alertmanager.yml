route:
  receiver: sms
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 30m
receivers:
  - name: sms
    webhook_configs:
      - url: http://alert-relay:9095/alert
        send_resolved: true
        http_config:
          authorization: {type: Bearer, credentials_file: /run/secrets/alert_relay_token}
