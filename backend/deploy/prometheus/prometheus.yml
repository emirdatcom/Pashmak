# Internal-network only: no port is published (see docker-compose.yml). Alerts go to alertmanager → alert-relay → sms.ir.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:9090"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
