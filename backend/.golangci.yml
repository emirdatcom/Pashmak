version: "2"
linters:
  default: none
  enable: [govet, staticcheck, errcheck, gosec, revive, gocritic]
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
      # Operator CLIs and the linter read operator-supplied paths/URLs by design.
      - path: (cmd/admin-cli|cmd/content-lint|internal/contentlint|internal/platform/schemas)/
        linters: [gosec]
formatters:
  enable: [gofmt]
