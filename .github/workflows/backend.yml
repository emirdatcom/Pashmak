name: backend
on:
  push: {paths: ["backend/**", ".github/workflows/backend.yml"]}
  pull_request: {paths: ["backend/**"]}
defaults:
  run: {working-directory: backend}
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26", cache-dependency-path: backend/go.sum}
      - uses: golangci/golangci-lint-action@v8
        with: {working-directory: backend}
      - run: go test ./... -race
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - uses: sqlc-dev/setup-sqlc@v4
        with: {sqlc-version: "1.27.0"}
      - run: sqlc diff
      - run: docker build -f deploy/Dockerfile -t backend:ci .
