name: backend
on:
  push: {paths: ["backend/**", "config-data/**", ".github/workflows/backend.yml"]}
  pull_request: {paths: ["backend/**", "config-data/**"]}
defaults:
  run: {working-directory: backend}
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26", cache-dependency-path: backend/go.sum}
      - uses: golangci/golangci-lint-action@v8
        with: {working-directory: backend}
      - run: go test ./... -race
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - uses: sqlc-dev/setup-sqlc@v4
        with: {sqlc-version: "1.31.1"}
      - run: sqlc diff
      - name: content-lint (config, content packs, analytics catalog)
        run: go run ./cmd/content-lint -dir ../config-data
      - name: docker build
        working-directory: .
        run: docker build -f backend/deploy/Dockerfile -t backend:ci .
